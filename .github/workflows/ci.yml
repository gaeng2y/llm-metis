name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
        node: ['22.15.0', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Verify Apple Silicon
        if: runner.os == 'macOS'
        run: node -e "if (process.arch !== 'arm64') throw new Error('Expected Apple Silicon runner')"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
